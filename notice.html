<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông báo FO3 Offline</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 20px;
            background-color: #12151a;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-size: 14px;
            line-height: 1.6;
        }
        .notice-container {
            background: linear-gradient(180deg, #1a202c 0%, #151922 100%);
            border: 1px solid #2d3748;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
        }
        .notice-header {
            display: flex;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid #2d3748;
        }
        .notice-header h2 {
            margin: 0;
            font-size: 17px;
            color: #f59e0b;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .notice-content {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
            word-break: break-word;
        }
        a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }
        a:hover {
            color: #7dd3fc;
            text-decoration: underline;
        }
        ::-webkit-scrollbar {
            width: 7px;
        }
        ::-webkit-scrollbar-track {
            background: #12151a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body>
    <div class="notice-container">
        <div class="notice-header">
            <h2>📢 THÔNG BÁO MÁY CHỦ</h2>
        </div>
        <div class="notice-content">
Trang chủ/Homepage: <a href="https://www.fo3offline.asia/" target="_blank">https://www.fo3offline.asia/</a><br>
Cảm ơn nhận được sự ủng hộ, đóng góp ý kiến từ cộng đồng game thủ trên khắp mọi miền!<br>

        </div>
    </div>
</body>
</html>
